<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOLA 大墩店 蔡KOBE 專屬出清網</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background-color: #faf7f2;
            color: #4a4a4a;
            margin: 0;
            padding: 20px;
        }
        .header {
            background-color: #8d6e63;
            color: #fff;
            text-align: center;
            padding: 30px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(141, 110, 99, 0.2);
        }
        .header h1 { margin: 0 0 12px 0; font-size: 24px; letter-spacing: 2px; }
        .warning-box {
            background-color: #fff8e1;
            color: #8d6e63;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0 10px 0;
            line-height: 1.8;
            text-align: left;
            border: 1px solid #d7ccc8;
        }
        .qr-code {
            width: 150px;
            height: 150px;
            background-color: #fff;
            margin: 15px auto;
            display: block;
            border: 4px solid #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .line-id-text {
            font-size: 15px; 
            color: #ffd54f; 
            margin-top: 12px; 
            letter-spacing: 1px;
        }
        .control-panel {
            background: #fff;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-between;
            align-items: center;
        }
        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .filter-btn {
            background-color: #efebe9;
            color: #5d4037;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .filter-btn:hover { background-color: #d7ccc8; }
        .filter-btn.active {
            background-color: #8d6e63;
            color: #fff;
        }
        .sort-select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #d7ccc8;
            background-color: #fff;
            color: #5d4037;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }
        .product-card {
            background: #fff;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border-top: 5px solid #d7ccc8;
        }
        .product-header-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .product-title { font-size: 20px; font-weight: bold; color: #5d4037; }
        .product-category-tag {
            background-color: #efebe9;
            color: #795548;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }
        .product-id { color: #9e9e9e; font-size: 13px; margin-bottom: 15px; margin-top: 5px; }
        .price-zone {
            background: #fbe9e7;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            display: flex;
            align-items: baseline;
        }
        .original-price { text-decoration: line-through; color: #a1887f; font-size: 15px; margin-right: 15px; }
        .sale-price { color: #d84315; font-size: 24px; font-weight: bold; }
        .product-image { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 15px; }
        .product-image a { width: calc(33.333% - 8px); min-width: 100px; }
        .product-image img {
            width: 100%;
            height: 180px;
            object-fit: contain;
            background-color: #f5f5f5;
            border-radius: 8px;
            border: 1px solid #eeeeee;
            transition: transform 0.3s ease;
        }
        .product-image img:hover { transform: translateY(-3px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .product-desc { 
            margin-top: 20px; 
            line-height: 1.8; 
            color: #6d4c41; 
            padding: 15px; 
            background: #fafafa; 
            border-radius: 8px; 
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>HOLA 居家生活 - 大墩店</h1>
        <div style="font-size: 16px; margin-bottom: 15px; color: #d7ccc8;">家具銷售專員 蔡KOBE 為您精選</div>
        
        <img id="line-qr" src="" alt="加我LINE" class="qr-code" referrerpolicy="no-referrer">
        <div class="line-id-text">
            若無法掃描，請手動輸入 LINE ID：satanhotdog
        </div>

        <div class="warning-box">
            <strong style="color: #5d4037;">溫馨提醒：</strong><br>
            此為專員個人整理之限量出清目錄。因門市現場同步展售，商品可能隨時尋得新主人。<br>
            為保障您的權益，看中喜歡的商品，請務必先透過 LINE 聯繫確認保留！<br>
            <div style="margin-top: 12px; padding-top: 12px; border-top: 1px dashed #cfd8dc; color: #d84315; font-weight: bold; text-align: center;">
                ※ 業績採個人制，來店請指名「家具區 蔡先生」 ※
            </div>
        </div>
    </div>

    <div class="control-panel">
        <div class="filter-buttons" id="filter-container">
            <button class="filter-btn active" onclick="filterCategory('全部', this)">全部商品</button>
            <button class="filter-btn" onclick="filterCategory('La-z-boy休閒椅', this)">La-z-boy休閒椅</button>
            <button class="filter-btn" onclick="filterCategory('家具', this)">家具</button>
            <button class="filter-btn" onclick="filterCategory('床墊', this)">床墊</button>
            <button class="filter-btn" onclick="filterCategory('地毯', this)">地毯</button>
        </div>
        <select class="sort-select" id="sort-select" onchange="changeSort()">
            <option value="default">預設排序</option>
            <option value="low-high">價格：低 ➔ 高</option>
            <option value="high-low">價格：高 ➔ 低</option>
        </select>
    </div>

    <div id="product-container">
        <h3 style="text-align: center; color: #a1887f;">正在為您準備精選目錄，請稍候...</h3>
    </div>

    <script>
        document.getElementById('line-qr').src = `https://drive.google.com/thumbnail?id=1TiN0ymrbT3brnIXH_vghYGFYoCeO37T5&sz=w500&dummy=${new Date().getTime()}`;

        const sheetUrl = 'https://docs.google.com/spreadsheets/d/1cgq8GMxzwaKzw3l2JMPb4pCKzCdb5ZRYGkDp0-R6lbg/export?format=csv';

        let allProducts = [];
        let currentCategory = '全部';
        let currentSort = 'default';

        function fixGoogleDriveUrl(url) {
            if (!url) return '';
            const match = url.match(/[-\w]{25,}/);
            if (match && match[0]) {
                const now = new Date().getTime(); 
                return `https://drive.google.com/thumbnail?id=${match[0]}&sz=w1000&dummy=${now}`;
            }
            return url;
        }

        function parseCSV(str) {
            const arr = [];
            let quote = false;
            let row = 0, col = 0;
            for (let c = 0; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];
                arr[row] = arr[row] || [];
                arr[row][col] = arr[row][col] || '';
                
                if (cc === '"' && quote && nc === '"') { arr[row][col] += cc; ++c; continue; }
                if (cc === '"') { quote = !quote; continue; }
                if (cc === ',' && !quote) { ++col; continue; }
                if (cc === '\r' && nc === '\n' && !quote) { ++row; col = 0; ++c; continue; }
                if (cc === '\n' && !quote) { ++row; col = 0; continue; }
                if (cc === '\r' && !quote) { ++row; col = 0; continue; }
                arr[row][col] += cc;
            }
            return arr;
        }

        function renderProducts() {
            const container = document.getElementById('product-container');
            container.innerHTML = ''; 

            let filtered = allProducts.filter(p => {
                if (currentCategory === '全部') return true;
                return p.category === currentCategory;
            });

            filtered.sort((a, b) => {
                const priceA = parseFloat(a.salePrice.toString().replace(/[^0-9.]/g, '')) || 0;
                const priceB = parseFloat(b.salePrice.toString().replace(/[^0-9.]/g, '')) || 0;
                
                if (currentSort === 'low-high') return priceA - priceB;
                if (currentSort === 'high-low') return priceB - priceA;
                return 0;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<h3 style="text-align: center; color: #a1887f; padding: 40px;">目前此分類尚無上架商品，請挑選其他分類。</h3>';
                return;
            }

            filtered.forEach(p => {
                let imagesHtml = '';
                p.imgUrls.forEach(url => {
                    const fixedUrl = fixGoogleDriveUrl(url);
                    imagesHtml += `
                        <a href="${fixedUrl}" target="_blank" title="點擊檢視完整圖片">
                            <img src="${fixedUrl}" alt="${p.name}" referrerpolicy="no-referrer">
                        </a>
                    `;
                });

                if (imagesHtml === '') {
                    imagesHtml = '<span style="color:#bcaaa4; font-style:italic;">實拍圖片整理中，請透過 LINE 索取。</span>';
                }

                const productHtml = `
                    <div class="product-card">
                        <div class="product-header-info">
                            <div class="product-title">${p.name}</div>
                            <span class="product-category-tag">${p.category || '未分類'}</span>
                        </div>
                        <div class="product-id">商品貨號：${p.id}</div>
                        <div class="price-zone">
                            <span class="original-price">原價：$${p.originalPrice}</span>
                            <span class="sale-price">出清價：$${p.salePrice}</span>
                        </div>
                        <div class="product-image">
                            ${imagesHtml}
                        </div>
                        <div class="product-desc">
                            ${p.desc}
                        </div>
                    </div>
                `;
                container.innerHTML += productHtml;
            });
        }

        function filterCategory(category, btn) {
            currentCategory = category;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderProducts();
        }

        function changeSort() {
            currentSort = document.getElementById('sort-select').value;
            renderProducts();
        }

        fetch(sheetUrl)
            .then(response => response.text())
            .then(csvText => {
                const rows = parseCSV(csvText);
                allProducts = [];
                
                for (let i = 1; i < rows.length; i++) {
                    const cols = rows[i];
                    // 配合你目前的試算表順序：
                    // cols[0] = 時間戳記
                    // cols[1] = 貨號
                    // cols[2] = 品名
                    // cols[3] = 原價
                    // cols[4] = 出清價
                    // cols[5] = 商品說明
                    // cols[6] = 上傳照片
                    // cols[7] = 商品品類 (排在最後面)
                    if (!cols || cols.length < 2 || !cols[1]) continue; 
                    
                    const id = cols[1] || '';
                    const name = cols[2] || '';
                    const originalPrice = cols[3] || '';
                    const salePrice = cols[4] || '';
                    const desc = (cols[5] || '').replace(/\n/g, '<br>');
                    
                    // 照片網址在 cols[6]，如果有多張用逗號隔開
                    let imgUrls = [];
                    if (cols[6]) {
                        cols[6].split(',').forEach(u => {
                            const cleanU = u.trim();
                            if (cleanU) imgUrls.push(cleanU);
                        });
                    }

                    // 品類在最後面的 cols[7]
                    const category = cols[7] || '未分類';

                    allProducts.push({
                        id, name, category, originalPrice, salePrice, desc, imgUrls
                    });
                }

                renderProducts();
            })
            .catch(error => {
                document.getElementById('product-container').innerHTML = '<h3 style="color:#d84315; text-align:center;">目錄整理中，請直接加 LINE 詢問最新庫存。</h3>';
            });
    </script>
</body>
</html>
